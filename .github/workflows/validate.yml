name: Validate AiEON

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, types, lint, build and server smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Test evidence and collector behavior
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build production application
        run: npm run build
      - name: Check production routes and rejected scan inputs
        run: npm run smoke
      - name: Check missing pilot credentials fail closed
        run: npm run smoke -- --unconfigured
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  prepare-security-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - name: Resolve targeted security updates for review
        run: |
          cp package-lock.json /tmp/aieon-lock-before.json
          npm install --package-lock-only --ignore-scripts --save-exact next@16.3.5
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@16.3.5
          npm update sharp --package-lock-only --ignore-scripts
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const before = JSON.parse(fs.readFileSync("/tmp/aieon-lock-before.json"));
          const after = JSON.parse(fs.readFileSync("package-lock.json"));
          const changes = Object.fromEntries(Object.entries(after.packages).filter(([key,value]) => JSON.stringify(before.packages[key]) !== JSON.stringify(value)));
          const removed = Object.keys(before.packages).filter(key => !(key in after.packages));
          console.log("AIEON_LOCK_PATCH=" + JSON.stringify({ changes, removed, package: JSON.parse(fs.readFileSync("package.json")) }));
          NODE
          npm audit --omit=dev --audit-level=high
